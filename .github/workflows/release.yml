name: release

on:
  push:
    tags:
      - 'v*'
  # Permite lanzarlo a mano para comprobar que el build pasa, sin publicar release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        #  - `ubuntu-22.04` en vez de `ubuntu-latest` porque glibc es compatible hacia
        #    delante pero no hacia atrás: compilar en 22.04 (glibc 2.35) hace que el
        #    binario funcione también en 24.04, Debian 12, etc.
        platform:
          - ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Dependencias del frontend
        run: bun install
        working-directory: app

      # Si no es un push de tag (workflow_dispatch), tagName y releaseName quedan
      # vacíos y la action solo compila, sin tocar releases.
      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Dopple {0}', github.ref_name) || '' }}
          releaseBody: |
            ### Instalación

            - **AppImage** — cualquier distro, sin instalar nada:
              ```sh
              chmod +x Dopple_*.AppImage
              ./Dopple_*.AppImage
              ```
            - **.deb** — Debian, Ubuntu, Mint
            - **.rpm** — Fedora, openSUSE

            Requiere glibc >= 2.35 (Ubuntu 22.04 o superior).

            En Wayland con NVIDIA, si la app aborta con `Error 71 (Error de protocolo)`,
            el binario ya trae el workaround aplicado.
          releaseDraft: false
          prerelease: false
